name: metalmax-wiki-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置非空 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请设置 POSTGRES_DB}
    command:
      ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=50']
    volumes:
      - postgres_data:/var/lib/postgresql
      # 仅初始化全新数据库的 pgvector 扩展；业务迁移必须另行执行 Alembic。
      - type: bind
        source: ./postgres/init.sql
        target: /docker-entrypoint-initdb.d/001-enable-vector.sql
        read_only: true
        bind:
          create_host_path: false
    networks: [database]
    shm_size: 128m
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ..
      dockerfile: infra/production/server.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: production
      API_PORT: '8000'
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?请设置 POSTGRES_USER}:${POSTGRES_PASSWORD:?请设置非空 POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?请设置 POSTGRES_DB}
      DATA_DIR: /app/data
      CLIENT_ORIGIN: https://${SITE_DOMAIN:?请设置不带协议和路径的 SITE_DOMAIN}
      AI_BASE_URL: ${AI_BASE_URL:?请设置容器可访问的模型接口 AI_BASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_MODEL: ${AI_MODEL:?请设置 AI_MODEL}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-4000}
      AI_MAX_EVIDENCE_CHUNKS: ${AI_MAX_EVIDENCE_CHUNKS:-12}
      AI_OLLAMA_CONTEXT_TOKENS: ${AI_OLLAMA_CONTEXT_TOKENS:-16384}
    volumes:
      - type: bind
        source: ../data/interim
        target: /app/data/interim
        read_only: true
        bind:
          create_host_path: false
    networks: [application, database]
    expose: ['8000']
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  client:
    build:
      context: ..
      dockerfile: infra/production/client.Dockerfile
      args:
        API_BASE_URL: http://server:8000
    restart: unless-stopped
    init: true
    environment:
      API_BASE_URL: http://server:8000
      NODE_OPTIONS: --max-old-space-size=640
    networks: [application]
    expose: ['3000']
    depends_on:
      server:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请设置不带协议和路径的 SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?请设置 ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - type: bind
        source: ./production/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    networks: [application]
    depends_on:
      client:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:2019/config/',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  application:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
