<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1038" role="img" aria-labelledby="title desc">
  <title id="title">拜亚斯都市：终盘解锁链</title>
  <desc id="desc">展示同步器、两张ID卡与两组密码、四保护锁、电梯供电、双加速器和三阶段决战的逻辑条件。。原创流程示意 · 非实机地图</desc>
  <rect width="840" height="1038" rx="20" fill="#f4f7fa" />
  <text x="48" y="51" fill="#183243" font-size="25" font-family="sans-serif" font-weight="700">拜亚斯都市：终盘解锁链</text>
  <text x="48" y="80" fill="#546878" font-size="15" font-family="sans-serif">箭头表示推荐推进次序与事件条件，不表示地理距离或坐标。</text>
  <rect x="48" y="112" width="744" height="84" rx="12" fill="#ffffff" stroke="#c9d7df" stroke-width="1.5" />
  <circle cx="80" cy="154" r="16" fill="#176c73" />
  <text x="80" y="160" text-anchor="middle" fill="#ffffff" font-size="16" font-family="sans-serif">1</text>
  <text x="112" y="147" fill="#183243" font-size="18" font-family="sans-serif">恶魔岛6F取同步器</text>
  <text x="112" y="173" fill="#183243" font-size="18" font-family="sans-serif">用它开启都市大门，保留万能钥匙</text>
  <path d="M420 199 V221 M414 214 L420 221 L426 214" fill="none" stroke="#6d8797" stroke-width="2.5" />
  <rect x="48" y="230" width="744" height="84" rx="12" fill="#ffffff" stroke="#c9d7df" stroke-width="1.5" />
  <circle cx="80" cy="272" r="16" fill="#176c73" />
  <text x="80" y="278" text-anchor="middle" fill="#ffffff" font-size="16" font-family="sans-serif">2</text>
  <text x="112" y="265" fill="#183243" font-size="18" font-family="sans-serif">地表：ID卡A与B，两组门禁密码</text>
  <text x="112" y="291" fill="#183243" font-size="18" font-family="sans-serif">左4864／右2568 → 第二道ID门</text>
  <path d="M420 317 V339 M414 332 L420 339 L426 332" fill="none" stroke="#6d8797" stroke-width="2.5" />
  <rect x="48" y="348" width="744" height="84" rx="12" fill="#ffffff" stroke="#c9d7df" stroke-width="1.5" />
  <circle cx="80" cy="390" r="16" fill="#176c73" />
  <text x="80" y="396" text-anchor="middle" fill="#ffffff" font-size="16" font-family="sans-serif">3</text>
  <text x="112" y="383" fill="#183243" font-size="18" font-family="sans-serif">B2右下 → B3两处锁</text>
  <text x="112" y="409" fill="#183243" font-size="18" font-family="sans-serif">泰德房间第四锁，全部解除</text>
  <path d="M420 435 V457 M414 450 L420 457 L426 450" fill="none" stroke="#6d8797" stroke-width="2.5" />
  <rect x="48" y="466" width="744" height="84" rx="12" fill="#ffffff" stroke="#c9d7df" stroke-width="1.5" />
  <circle cx="80" cy="508" r="16" fill="#176c73" />
  <text x="80" y="514" text-anchor="middle" fill="#ffffff" font-size="16" font-family="sans-serif">4</text>
  <text x="112" y="501" fill="#183243" font-size="18" font-family="sans-serif">关闭复制士兵组织者，通风口开门</text>
  <text x="112" y="527" fill="#183243" font-size="18" font-family="sans-serif">回车由B4中央坡道开启电梯电源</text>
  <path d="M420 553 V575 M414 568 L420 575 L426 568" fill="none" stroke="#6d8797" stroke-width="2.5" />
  <rect x="48" y="584" width="744" height="84" rx="12" fill="#ffffff" stroke="#c9d7df" stroke-width="1.5" />
  <circle cx="80" cy="626" r="16" fill="#176c73" />
  <text x="80" y="632" text-anchor="middle" fill="#ffffff" font-size="16" font-family="sans-serif">5</text>
  <text x="112" y="619" fill="#183243" font-size="18" font-family="sans-serif">艾娃事件完成后向玛丽琳取密码</text>
  <text x="112" y="645" fill="#183243" font-size="18" font-family="sans-serif">最底层两个加速器控制台均设OFF</text>
  <path d="M420 671 V693 M414 686 L420 693 L426 686" fill="none" stroke="#6d8797" stroke-width="2.5" />
  <rect x="48" y="702" width="744" height="84" rx="12" fill="#ffffff" stroke="#c9d7df" stroke-width="1.5" />
  <circle cx="80" cy="744" r="16" fill="#176c73" />
  <text x="80" y="750" text-anchor="middle" fill="#ffffff" font-size="16" font-family="sans-serif">6</text>
  <text x="112" y="737" fill="#183243" font-size="18" font-family="sans-serif">最终第一与第二阶段连续战</text>
  <text x="112" y="763" fill="#183243" font-size="18" font-family="sans-serif">预留迎击对策、电气与乘员防护</text>
  <path d="M420 789 V811 M414 804 L420 811 L426 804" fill="none" stroke="#6d8797" stroke-width="2.5" />
  <rect x="48" y="820" width="744" height="84" rx="12" fill="#ffffff" stroke="#c9d7df" stroke-width="1.5" />
  <circle cx="80" cy="862" r="16" fill="#176c73" />
  <text x="80" y="868" text-anchor="middle" fill="#ffffff" font-size="16" font-family="sans-serif">7</text>
  <text x="112" y="855" fill="#183243" font-size="18" font-family="sans-serif">第三战前营地恢复、修车补甲</text>
  <text x="112" y="881" fill="#183243" font-size="18" font-family="sans-serif">再战第三阶段并保存通关标记</text>
  <text x="48" y="991" fill="#546878" font-size="15" font-family="sans-serif">原创流程示意 · 非实机地图</text>
  <text x="48" y="1015" fill="#546878" font-size="13" font-family="sans-serif">Metal Max Wiki 项目原创；事实出处见同章引用，未复用外部截图或地图像素。</text>
</svg>
