packages:
  - apps/frontend/*
  - packages/*

strictPeerDependencies: true
autoInstallPeers: false
nodeLinker: isolated
sharedWorkspaceLockfile: true

catalog:
  '@eslint/js': 9.39.5
  '@tailwindcss/postcss': 4.3.3
  '@types/node': 22.20.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  concurrently: 10.0.5
  eslint: 9.39.5
  eslint-config-next: 16.3.5
  inquirer: 9.2.15
  lucide-react: 1.47.0
  next: 16.3.5
  prettier: 3.9.8
  prettier-plugin-tailwindcss: 0.8.1
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: 6.0.3
  vite: 8.3.4
  vitest: 5.0.4
  zod: 4.6.5

allowBuilds:
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - prettier@3.9.8
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
