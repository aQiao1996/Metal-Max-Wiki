acquisition:
  バギー: 在马多推进“穿越沙漠”任务，返回奈鲁的车库调查车辆并命名；也可购买租赁3号。
  装甲車: 在渴望酒吧东南方、沙漠南端发掘；也可购买租赁5号或8号。
  野バス: 用金属探测器找到佛像村东南方沙地的埋藏巴士站，调查站牌后调查停靠的野巴士；也可购买租赁7号或10号。
  ウルフ: 在弗拉德博物馆B1输入4649，操作升降台取得；初始未装C装置和引擎，也可购买租赁13号。
  ゲパルト: 在大社神社用黏液细胞移开挡路的狗，再用万能钥匙打开门取得；也可购买租赁12号或15号。
  マンムート: 在死路洞B5从外侧轰开墙壁、排水后回收；也可购买租赁11号或18号。
  エレファント: 在赫尔梅兹岛地下二层07号仓库取得；也可购买租赁19号。
  アビシニアン: 在巴特研究所与博士成为朋友后设计，交足所需废铁完成制造；也可购买租赁9号。
  ストラディバリ: 在巴特研究所与博士成为朋友后设计，交足所需废铁完成制造；也可购买租赁16号。
  ティーガー: 在巴特研究所与博士成为朋友后设计，交足所需废铁完成制造；也可购买租赁17号。
  レオパルト: 在巴特研究所与博士成为朋友后设计，交足所需废铁完成制造；也可购买租赁14号。
  ストレイドッグ: 向马多东南商人营地的卖车人支付1000G购买。
  白バイ: 取得并命名1号战车、等级达到12后，在无名酒吧接下“复仇的摩托”并取得钥匙时入手；击败蚁蝎与回报属于后续任务步骤。
  ゼロ: 在被掩埋的大楼用金属探测器找到3F控制电脑及最底层白骨，取得大佐识别牌后读取38195163，回3F升起升降台，在地表取得。
  スーパーカー: 从租赁战车店购买租赁1号、4号或6号。
  サイファイ: 从租赁战车店购买租赁2号。
notes:
  野バス: 通常入手的野巴士不能改为双引擎；租赁10号的初始双引擎是单独例外。
  エレファント: 来源只列初始配置，不能进行阶段改造，孔位仍有独立改造选项。
  アビシニアン: 四行配置为巴特设计预设，均属阶段1；不能在普通底盘改造店修改。
  ストラディバリ: 四行配置为巴特设计预设，均属阶段1；不能在普通底盘改造店修改。
  ティーガー: 四行配置为巴特设计预设，均属阶段1；不能在普通底盘改造店修改。
  レオパルト: 四行配置为巴特设计预设，均属阶段1；不能在普通底盘改造店修改。
  スーパーカー: 阶段配置表另有固定武装列，记录车门固定武器的安装限制。
condition_sources:
  バギー:
    - source_url: https://metalmaniax.com/index.php?MM2R/DATA/クエスト/砂漠を越えて
      section_ja: 達成条件
      summary_zh: 前往厄尔尼诺与战车用品店柜台左侧男子交谈，返回马多与奈鲁交谈后，调查越野车并命名。
      evidence_ja: [エルニニョの町へ行き, バギーを調べ、名前をつける]
  装甲車:
    - source_url: https://metalmaniax.com/index.php?MM2R/DATA/戦車/装甲車
      section_ja: 入手場所
      summary_zh: 装甲车埋在渴望酒吧东南方沙漠的南端。
      evidence_ja: [酒場サースティ, 南東の砂漠(南端)に埋没。]
  野バス:
    - source_url: https://metalmaniax.com/index.php?MM2R/攻略/攻略ガイド/ノボトケの村
      section_ja: 野バスと踊ろう
      summary_zh: 不必先付费买情报；在村庄东南方沙地用金属探测器找出巴士站，调查站牌并取得停靠的野巴士。
      evidence_ja: [地雷探知機（金属探知機）, バス停が出現, 野バスを自分のもの]
  ウルフ:
    - source_url: https://metalmaniax.com/index.php?MM2R/攻略/攻略ガイド/ヴラド博物館
      section_ja: ウルフ入手
      summary_zh: 博物馆B1的门锁密码为4649；操作电脑升降台取车，取得时没有C装置和引擎。
      evidence_ja: ['4649', B1F, Cユニットとエンジンが付いていない]
  ゲパルト:
    - source_url: https://metalmaniax.com/index.php?MM2R/DATA/戦車/ゲパルト
      section_ja: 入手場所
      summary_zh: 大社神社的门需要万能钥匙，挡路的狗需要用黏液细胞移开。
      evidence_ja: [ロックハッカーが必要, ぬめぬめ細胞が必要]
  マンムート:
    - source_url: https://metalmaniax.com/index.php?MM2R/攻略/攻略ガイド/いきどまり洞
      section_ja: マンムート発見
      summary_zh: 底盘在B5被水淹没；沿坡道绕到外侧轰开墙壁，排水后回收。
      evidence_ja: [B5F, 外から壁を破壊, 水が引いて]
  エレファント:
    - source_url: https://metalmaniax.com/index.php?MM2R/DATA/戦車/エレファント
      section_ja: 入手場所
      summary_zh: 象式战车位于赫尔梅兹岛地下二层07号仓库。
      evidence_ja: [ヘルメツ島, 地下二階07番倉庫]
  アビシニアン: &batou_sources
    - source_url: https://metalmaniax.com/index.php?MM2R/攻略/攻略ガイド/バトー研究所
      section_ja: バトー博士は友達が少ない
      summary_zh: 与巴特博士成为朋友后，可以设计战车。
      evidence_ja: [友達になったら戦車を作ってくれる]
    - source_url: https://metalmaniax.com/index.php?MM2R/攻略/攻略ガイド/バトー研究所
      section_ja: 世界に一つだけの戦車
      summary_zh: 从四种底盘选择并设计，交足要求的废铁后制造完成；造好的车辆不能在普通底盘改造店修改。
      evidence_ja:
        [
          4種から選択,
          てつクズを集め終われば戦車が完成,
          シャシー改造屋での改造ができない,
        ]
  ストラディバリ: *batou_sources
  ティーガー: *batou_sources
  レオパルト: *batou_sources
  ストレイドッグ:
    - source_url: https://metalmaniax.com/index.php?MM2R/攻略/攻略ガイド/マド南東
      section_ja: 安い？高い？
      summary_zh: 向马多东南商人营地的卖车人支付1000G即可购得9号战车。
      evidence_ja: [1000Gで購入, No.9戦車]
  白バイ:
    - source_url: https://metalmaniax.com/index.php?MM2R/DATA/クエスト/復讐のバイク
      section_ja: 発生条件
      summary_zh: 取得并命名1号战车触发酒吧猎人出现；等级达到12才能接下任务并取得钥匙。
      evidence_ja: [No.1戦車, レベルが12に到達していないと]
    - source_url: https://metalmaniax.com/index.php?MM2R/DATA/クエスト/復讐のバイク
      section_ja: 達成条件
      summary_zh: 收到摩托钥匙时10号战车已经正式归玩家，不必等击败蚁蝎并回报后才取得所有权。
      evidence_ja: [実はこの時点でNo.10戦車は正式にこちらのものになる]
  ゼロ:
    - source_url: https://metalmaniax.com/index.php?MM2R/攻略/攻略ガイド/埋もれたビル
      section_ja: No.12戦車：ゼロ入手手順
      summary_zh: 用金属探测器在3F找到电脑，在最底层白骨取得大佐识别牌读取38195163；回3F升起升降台后去地表取车。
      evidence_ja: [3階, 金属探知機, '38195163', リフトを上げる]
  スーパーカー:
    - source_url: https://metalmaniax.com/index.php?MM2R/DATA/戦車/スーパーカー
      section_ja: 入手場所
      summary_zh: 超级跑车可通过购买租赁1号、4号、6号取得。
      evidence_ja: [1号、4号、6号を購入]
  サイファイ:
    - source_url: https://metalmaniax.com/index.php?MM2R/DATA/戦車/サイファイ
      section_ja: 入手場所
      summary_zh: 科幻摩托可通过购买租赁2号取得。
      evidence_ja: [2号を購入]
