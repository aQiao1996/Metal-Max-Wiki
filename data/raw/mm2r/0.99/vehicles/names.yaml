aliases:
  バギー: [加西亚战车, 吉普车]
  ウルフ: [红狼战车, 红狼, R狼, S狼, 4号车, 4号战车]
  ゲパルト: [战神, 战神战车, 猎豹, 5号车, 5号战车]
  マンムート: [猛犸]
  エレファント: [巨象战车]
