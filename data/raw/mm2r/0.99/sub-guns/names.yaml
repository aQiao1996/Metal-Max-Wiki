effects:
  ロケットチューブ: 副炮类别，固定一星，具有有限弹仓；不能把所有副炮都当作无限弹药。
  ソニックチューブ: 音波属性、全体攻击，具有有限弹仓；具体弹仓改造值按星级表查看。
  スキャンレーザー: 名称含激光，但来源总表列为通常属性、全体攻击；不按名称猜测光束属性。
  アサルトレーザー: 名称含激光，但来源总表列为通常属性、全体攻击。
  サンビームガン: 来源总表列为通常属性、全体攻击，不是光束属性。
  ギガンガン: 来源列为MM3转送品，固定二星；无星数值仅作参考，不能据此认定本作可直接获取。
acquisition:
  さびた機銃: 码头镇北方沙漠、阿梓莎至萨斯蒂酒吧之间、雨谷等处随机埋藏，需金属探测器；赫尔梅兹岛B1F北侧房间木箱。
  7ミリ機銃: 越野车初始装备；也可通过超光速传送取得チョッパー初始装备的无星品。
  7.7ミリ機銃: 警用摩托及出租战车1、4号初始装备为无星品；码头镇北方营地周边绿地随机埋藏，星级随机。
  9ミリ機銃: 厄尔尼诺商店；出租战车2号初始装备；码头镇北方商人营地周边荒地随机埋藏，需金属探测器，星级随机。
  ガトリングガン: 码头镇商店；出租战车3号初始装备为无星品；狗之村南侧沙滩随机埋藏，星级随机。
  13ミリ機銃: 阿梓莎及该镇北方商人营地；红狼战车初始装备；布拉德博物馆周边沙漠随机埋藏，星级随机。
  ファイアショット: 码头镇、阿梓莎商店。
  11ミリバルカン: 萨斯蒂酒吧商店；德尔塔·利奥东北商人营地出售改造品；德尔塔·利奥东侧随机埋藏，星级随机。
  冷気放射器: 萨斯蒂酒吧商店；布拉德博物馆B1F木箱；德尔塔·利奥东侧半岛尖端随机埋藏，星级随机。
  フォースバルカン: 德尔塔·利奥C型商店。
  9ミリチェインガン: 巴扎斯卡商店；德尔塔·利奥东北商人营地西侧荒地随机埋藏，需金属探测器，星级随机。
  15ミリバルカン: 巴扎斯卡、霍克交易所商店；首次在巴特处制造战车时预留机枪孔可获赠；以斯拉港附近随机埋藏，星级随机。
  ビームブラスター: 阿梓莎正东方向、道路尽头稍前处埋藏，需金属探测器，星级随机。
  イナズマシュート: 巴扎斯卡商店；铁爪塔5F木箱，星级随机；电击球炮（電撃ボール砲）掉落。
  マスタードコブラ: 荒野运输任务送货前，德尔塔·利奥和以斯拉港商店出售；德尔塔·利奥东北营地出售改造品；北之魔女之家西北商人营地的东北山间随机埋藏。
  スキャンレーザー: 贝内特海之家东侧附近打捞可得无星品；赫尔梅兹岛B1F上侧房间木箱，星级随机。
  おんちスピーカー: 会唱歌的抛物面天线（うたうパラボラ）掉落。
  16ミリ機銃: 荒野运输送货后，德尔塔·利奥商店追加；出租战车6、7号初始装备为无星品；赫尔梅兹岛B2F木箱；ナイトシェイド、バブルカニガン、ウニガン、アクアウォーカー掉落。
  ビームランサー: 佛像村东侧商人营地；T69イエティ掉落。
  サンダーブラスト: 荒野运输送货后，以斯拉港商店追加；猴子中心附近随机埋藏，需金属探测器，星级随机。
  ナパームジェッター: 以斯拉港西侧商人营地；火焰鲎（火炎カブトガニ）、地狱火炉（地獄のストーブ）掉落；履带村附近随机埋藏。
  13ミリチェイン: 大神社商店；也可通过超光速传送取得0～2星品。
  ビッグガン: 以斯拉港东北、从恶党博物馆向西直走所见枯树正下方埋藏，需金属探测器，星级随机；赫尔梅兹岛B3F南侧房间木箱。
  スマッシュホルン: 大神社、摩洛波克东侧商人营地；赫尔梅兹岛B2F木箱，星级随机。
  スペクトルガン: 大神社A型商店。
  アサルトレーザー: 风力发电所西南商人营地出售无星品；摩洛波克东侧商人营地；象式战车初始装备及ミラーボール掉落为无星品；超光速传送可得0～3星品。
  18ミリバルカン: 荒野运输送货后，摩洛波克商店追加；P3Cビー掉落无星品，ガンケーキ也会掉落。
  タイムストッパー: 摩洛波克商店。
  バスターフルート: 履带村及该村北侧商人营地。
  スネークガン: 大型垃圾搜寻者（デカごみあさり）A型个体、ゴーゴンホール掉落。
  ファイアガン: 履带村商店。
  フリーズガン: 死亡十字解放后的商店；死亡十字西侧沙漠商人营地。
  ミスターチムニー: 死亡十字解放后的商店；溶解城商店出售无星品；超光速传送可得0～3星品。
  ヘビーガン: 死亡十字西侧沙漠埋藏，需金属探测器，星级随机。
  バーナードラゴン: 溶解城商店；零号战车初始装备和ATプロメテウス掉落为无星品；超光速传送可得0～3星品。
  22ミリバルカン: 溶解城商店出售无星品；超光速传送可得0～3星品。
  ひぼたんバルカン: 超电磁战车（超電磁戦車）、完美守卫（パーフェクトガード）、ATVピューマ掉落；击破5000体奖励。
  楊貴妃バルカン: 溶解城东侧荒地埋藏，需金属探测器，星级随机。
  サンダーストーム: 击破6666体奖励，星级随机；プラズマタンク、ミュータントOX、ウシキング掉落。
  ノラバルカン: 赏金首ホバリング・ノラ掉落，星级随机。
  ロケットチューブ: 印章店500积分奖励，固定1星。
  キャノンチューブ: 摩洛波克A型商店。
  シャークガン: 赏金首U-U-シャーク掉落，星级随机。
  ソニックチューブ: 以斯拉港B型商店。
  猛牛罵流管: 通过超光速传送取得，固定2星。
  土星フリーザー: 通过超光速传送取得，固定1星。
  ギガンガン: 通过超光速传送取得，固定2星。
  ジャックスイーパー: 通过超光速传送取得，固定2星。
  サンビームガン: 出租战车19号初始装备；也可通过超光速传送取得。
  ローズバルカン改: 将玫瑰火神炮（ローズバルカン）通过超光速传送转送，星级范围0～3星。
