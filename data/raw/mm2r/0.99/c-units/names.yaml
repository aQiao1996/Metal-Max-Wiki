acquisition:
  さびたCユニット: 熔岩镇周边等多处随机埋藏，需要金属探测器。
  システムRENTA: 租赁战车专用，无法作为自有装备获得。
  HAL900: 玛多东南商人营地出售；越野车初始装备。
  ライダーブレイン: 野狗号初始装备；可由MM3通过超时空传送获得。
  無線ポリス: 白摩托初始装备；可由MM3警车初始装备转送获得。
  スパシーボII: 厄尔尼诺、码头镇出售；野巴士和战神初始装备为无星；码头镇北部沙漠及佛像村周边草地随机埋藏，星级可变。
  ウォズニアクII: 梓镇及其北部商人营地出售，限商店货物模式C。
  HAL800: 梓镇及其北部商人营地出售，限商店货物模式A。
  スパシーボIII: 梓镇及其北部商人营地出售，限商店货物模式B。
  エミー: 干渴酒吧、霍克交易所出售；德尔塔与以斯拉港运货前出售；霍克交易所至德尔塔之间随机埋藏，星级可变。
  カバレロ2022: 掠夺者之塔7层木箱，星级可变。
  アリス2027: 德尔塔出售，限商店货物模式A。
  ウォズニアクSI: 完成运货后德尔塔、履带村、北部商人营地出售；装甲车、巴特战车、购买的租赁车初始装备；干渴酒吧左侧随机埋藏；布拉德博物馆B1F升降机处。
  SOLOMON2: 打捞可得无星；MM3通信转送可得0至1星。
  SOLOMON3: 德尔塔北面倒塌水塔再往北的埋藏物，需要金属探测器，星级可变。
  ラクター: 完成运货后以斯拉港出售；大象初始装备；赫尔梅茨岛B2F的04号集装箱木箱，星级可变。
  99式神話: 大社镇出售；猛犸初始装备；赫尔梅茨岛B4F下层左侧木箱；金轮际旅馆（金輪際ホテル）南侧沙滩随机埋藏，星级可变。
  デス13: 大社镇出售，限商店货物模式B。
  アクセルノイマン: 风力发电站西南商人营地出售；零号战车初始装备；赫尔梅茨岛B3F南侧房间木箱，星级可变。
  キャノンボックス: 佛像村东侧、摩洛波克东侧商人营地出售；击破1250个敌人的奖励；MM3通信转送可得0至1星。
  バルカンボックス: 巴扎斯卡、完成运货后的德尔塔及摩洛波克东侧商人营地出售；击破750个敌人的奖励；MM3通信转送可得0至1星。
  ミサイルボックス: 以斯拉港西侧、摩洛波克东侧商人营地出售；击破2500个敌人的奖励；MM3通信转送可得0至1星。
  ダンシングドール: 摩洛波克东侧商人营地出售。
  スカイウォッチ: 摩洛波克战车道具店及东侧商人营地出售。
  ATストライク: 履带村出售；北之魔女家西北商人营地的东侧埋藏，需要金属探测器，星级可变。
  空冷雷神: 履带村出售，限商店货物模式C。
  スパイダーネット: 解放后的死亡十字、熔岩镇及死亡十字西侧沙漠商人营地出售；摩洛波克南部沙漠普通废墟南侧埋藏；也可从MM3转送。
  ジーニアス777: 雨谷内、熔岩镇东北方向埋藏；“阻止暴走野巴士”任务的奖励候选；击破7777个敌人的奖励，星级可变。
  ニューロPAC: 熔岩镇、死亡十字西侧沙漠商人营地出售；死路洞B4F木箱，星级可变；MM3的PAC3000转送后变化为此装置。
  コンボトロン: 寻找组合电子的任务奖励，固定一星。
  ジェミナイザー: 印章店750点奖励，固定一星。
  アクティブハリー: 印章店4000点奖励，固定一星。
  連動ヤヌス: 印章店2500点奖励，固定一星。
  ウオンディーヌ: 飞鱼乌翁（トビウオン）掉落。
  ダロス1000: 戴达罗斯（ダイダロス）掉落。
  ダロス3000: EX戴达罗斯（エクスダイダロス）掉落。
  サイレントダロス: EX戴达罗斯（エクスダイダロス）掉落。
  母トロン: 母舰恐龙（母艦サウルス）掉落。
  電撃的アミーゴ: “巴特的礼物”任务四选一奖励，固定二星。
  バイオブレイン: 需要MM3与2R进行超时空传送。
  サンバカーニバル: 需要MM3与2R进行超时空传送。
  セナ2022: 通过MM3超时空传送获得0至3星品；原作关联敌人为速度王。
  ジャックアローン: 通过MM3超时空传送获得0至3星品。
  ヌイーゼン改: MM3的诺依森通过超时空传送后变化为此装置，无星。
  ティターン改: MM3的提坦通过超时空传送后变化为此装置，无星。
  アポロニア改: MM3的阿波罗尼亚通过超时空传送后变化为此装置。
  クレオパトラ改: MM3的克娄巴特拉通过超时空传送后变化为此装置。
  プルート改: MM3的冥王通过超时空传送后变化为此装置，固定一星。
notes:
  システムRENTA: 租赁战车专用；买下租赁车时会换成沃兹尼亚克SI，不能作为自有装备获得。
  HAL900: 来源括号内另列理论防御上限，但重量限制会阻止改到该值；不要把括号值当作可达数值。
  ジェミナイザー: 作用于一号孔，能配合齐射与连射技能；武器自带的“多次攻击”与“多连射”不是同一种计数。
  アクティブハリー: 只装一件可攻击武器时，随机选择的攻击会集中到该武器；迎击专用与不能攻击的装备不参与抽取。
  連動ヤヌス: “双重连射”需要在战斗菜单主动选择，不会自动把所有攻击变成两次；有别于“双重打击”的被动增益。
  電撃的アミーゴ: 固定二星，增加一号孔连射数，不额外增加该次攻击的耗弹；部分喷射型火焰武器无效。
  サイレントダロス: 来源指出迎击回避疑似存在程序问题，实际表现更接近对空能力；不要据此保证炮弹不会被迎击。
  クレオパトラ改: 通过MM3通信转送获得；迎击回避在2R中的实际效果有疑点。
  サンバカーニバル: 身交闪避步行在2R的实际生效条件尚不明确，不能保证来源总表中的约4.5%适用于本作所有战车。
  バイオブレイン: MM3转送品；不能常规出售或丢弃，可存入寄存处。
traits:
  なし:
    name: 无特性
    activation: 无特性
    effect: 不提供额外的战斗特性。
    limits: 仍需关注重量、防御与获取条件。
  キャノンラッシュ:
    name: 主炮齐射
    activation: 主动指令
    effect: 新增主炮齐射指令，一次发射符合条件的主炮。
    limits: 仅使用能攻击且有弹药的武器；少数其他类别武器也可参与，不能据类别推断全部例外。
  バルカンラッシュ:
    name: 副炮齐射
    activation: 主动指令
    effect: 新增副炮齐射指令，一次发射符合条件的副炮。
    limits: 仅使用能攻击的对应武器；来源提示存在少数跨类别例外。
  S-Eラッシュ:
    name: S-E齐射
    activation: 主动指令
    effect: 新增S-E齐射指令，一次发射符合条件的S-E。
    limits: 弹药耗尽、损坏或迎击专用装备不能作为普通攻击使用；存在少数跨类别例外。
  身交わし走行:
    name: 闪避行驶
    activation: 被动生效
    effect: 来源总表记录身交闪避率约2%。
    limits: 与面板回避数值不同；同类效果不叠加，闪避步行优先。
  対空能力:
    name: 对空能力
    activation: 被动生效
    effect: 改善对空中目标的攻击表现，对神风类等目标也有作用。
    limits: 部分武器不适用；来源未给出统一命中提升百分比，不能等同于迎击。
  会心の一発:
    name: 会心一击
    activation: 被动生效
    effect: 来源总表记录会心率变为原来的2倍，可与同类特性叠加。
    limits: 只作用于一号孔；是会心概率倍率，不是伤害翻倍。独立详情提示总体概率存在约50%的上限。
  アース装着:
    name: 接地
    activation: 被动生效
    effect: 来源记录电击抗性按1.95倍处理，能大幅降低电击影响。
    limits: 抗性倍率不能直接当作最终减伤百分比，也不应保证所有电击伤害完全为零。
  迎撃能力:
    name: 迎击能力
    activation: 被动生效
    effect: 使具有迎击功能的武器尝试拦截敌方炮弹。
    limits: 需要武器本身支持迎击；对应武器包含部分通常、光束和电击武器，同优先级时优先使用孔号较小者。
  迎撃補助:
    name: 迎击辅助
    activation: 被动生效
    effect: 提高迎击的发动概率。
    limits: 来源未提供统一提升百分比，不代表凭空获得迎击武器，也不保证每次拦截成功。
  トリプルラッシュ:
    name: 三重齐射
    activation: 主动指令
    effect: 新增指令，一次发射一、二、三号孔中符合条件的武器。
    limits: 依赖对应孔位的可用武装，不是单件武器被动增加两发。
  ダブルストライク:
    name: 双重打击
    activation: 被动生效
    effect: 一号孔武器的连射数增加1，弹药消耗保持原有一次攻击的数量。
    limits: 可作用于连射技能和齐射中的一号孔；部分喷射型火焰武器无效，不作用于所有孔位。
  ダーティラッシュ:
    name: 辣手连射
    activation: 主动指令
    effect: 每次随机选择可攻击武器并发射，重复2至4次。
    limits: 耗尽弹药、严重损坏、迎击专用或不能攻击的装备不参与选择；不是所有武器固定发射四次。
  ダブルアタッカー:
    name: 双重连射
    activation: 主动指令
    effect: 新增双重射击指令，一号孔武器连续发动两次，弹药消耗为对应一次攻击的2倍。
    limits: 需要主动选择该指令；有别于双重打击，不会自动给其他攻击追加次数。
  トリプルアタッカー:
    name: 三重连射
    activation: 主动指令
    effect: 新增三重射击指令，一号孔武器连续发动三次，弹药消耗为对应一次攻击的3倍。
    limits: 需要主动选择该指令；有别于三重打击，不能当成所有孔位的被动加成。
  迎撃回避能力:
    name: 迎击回避
    activation: 效果待确认
    effect: 说明预期为一号孔攻击避开敌方迎击，但2R来源指出疑似程序问题，实际近似对空能力。
    limits: 不能按“无视迎击”可靠使用；未经0.99实机验证。
  トリプルストライク:
    name: 三重打击
    activation: 被动生效
    effect: 一号孔武器的连射数增加2，弹药消耗保持原有一次攻击的数量。
    limits: 部分喷射型火焰武器无效；不作用于所有孔位，不能把“增加2”写成所有武器伤害固定乘3。
  身交わし歩行:
    name: 闪避步行
    activation: 效果待确认
    effect: 来源总表记录身交闪避率约4.5%，但独立详情对2R中是否正常生效提出疑问。
    limits: 同类效果不叠加；2R实际适用条件未明确，不能保证该概率。
  耐電仕様:
    name: 耐电规格
    activation: 被动生效
    effect: 来源总表记录电击抗性按1.5倍处理。
    limits: 抗性倍率不等于最终减伤百分比，不能据此推算所有电击伤害。
mechanics_note: 命中与回避仅列来源面板数值，不能解释为实际命中率或闪避率。来源的有限样本对比未观察到明显效果，具体计算仍未明确；选装时应结合特性、重量和防御判断，不将面板增加直接换算成伤害提升。
