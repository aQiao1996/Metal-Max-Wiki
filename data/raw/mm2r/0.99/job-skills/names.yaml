job_summaries:
  ハンター:
    code: hunter-role
    source_page: ハンター
    section_ja: 概要
    summary_zh: 战车战专长，驾驶等级最易增长；可使用较多人类武器，但自身白兵技能较少。
    evidence_ja:
      - クルマ戦闘のスペシャリスト
      - 運転Lvが最も上がりやすい
      - 白兵戦用の特技
  メカニック:
    code: mechanic-role
    source_page: メカニック
    section_ja: 概要
    summary_zh: 负责维修受损和大破部件，也能在战斗中修理和补甲；驾驶等级较高，白兵耐久与武器选择受限。
    evidence_ja:
      - 修理のプロフェッショナル
      - 装甲タイルを貼ったり
      - 装備可能な武器が少なめ
  ソルジャー:
    code: soldier-role
    source_page: ソルジャー
    section_ja: 概要
    summary_zh: 擅长白兵战，能使用多种人类武器；驾驶等级较低，但有可在摩托上使用的技能。
    evidence_ja:
      - 白兵戦のプロ
      - 装備可能武器が豊富
      - バイク乗車時でも使用出来る
  ナース:
    code: nurse-role
    source_page: ナース
    section_ja: 概要
    summary_zh: 专注HP恢复、异常解除和急救；能增强恢复药品效果，并把恢复道具用于全体同伴。
    evidence_ja:
      - 薬の知識
      - 戦場の天使
      - 人数分消費
  レスラー:
    code: wrestler-role
    source_page: レスラー
    section_ja: 概要
    summary_zh: 以身体能力、强化和近身技能进行白兵输出；高腕力配合多段攻击，行动速度较慢。
    evidence_ja:
      - ドラムストレッチ
      - 生身での火力
  アーチスト:
    code: artist-role
    source_page: アーチスト
    section_ja: 概要
    summary_zh: 兼有战车与白兵连续攻击，并能制作特殊炮弹、进行车载装备超改造。
    evidence_ja:
      - クルマ・白兵両方で連続攻撃
      - 砲弾ゲージツ
      - 改造ゲージツ
  犬:
    code: dog-role
    source_page: 犬
    section_ja: 概要
    summary_zh: 由AI自行选择武器与辅助动作，不能单独驾驶战车；能随人搭乘多人车辆受到保护。
    evidence_ja:
      - 自分で操作出来ず、行動はAI任せ
      - 運転レベルは1で固定
      - 多人数用戦車に乗せる
skill_summaries:
  モーレツ看護: 不用道具进行比例治疗；来源按已损失HP的比例恢复，因此不能靠此技能直接回满。
  パンチラキック5: 以女性气质发动白兵踢击；来源说明男气越低，威力越强。
  復元ゲージツ: 消耗修理包修复破损部件；不能用机械师工具箱代替修理包。
  パンチラキック: 以女性气质发动白兵踢击；来源说明男气越低，威力越强。
  肉塊グラインダー: 旋转下落，同时攻击面前的所有敌人。
  エルボー乱気流: 对一名敌人连续肘击；首击伤害较高，后续每击为首击的一半，角色差异另见来源。
  おしっこ: 犬在判断自己难以有效作战时可能执行的本能动作；既有来源记载没有战斗效果。
  台風チョップ: 随机目标连续劈击4次，攻击可能分散；部分普通角色存在只出一击的异常。
  男気パンチ3: 以男气值发动白兵攻击；男气越高，威力越强。
  囮よせ: 将选定怪物引来交战；海上不能使用，也不能直接引来仅增援出现的敌人。
  破損修理: 使用修理工具修复破损的车辆部件。
  タイル命: 战斗中暂时下车，消耗装甲包补充车辆装甲。
  オーバードリップ: 赋予回合结束时自动恢复HP的效果，来源记载其持续至战斗结束。
  おたけび: 优先发动攻击，并在本回合提高全体同伴的攻击力。
  満タン看護: 不使用恢复道具，将一名同伴的HP完全恢复。
  武器の知識: 自动提高所装备人类武器的攻击力；不增加角色腕力。
  ヤバイ修理: 不用修理工具尝试修理部件，有失败或状况恶化的风险。
  戦場の天使: 把选定的恢复道具用于全体同伴，需消耗相应人数份的道具。
  パンチラキック4: 以女性气质发动白兵踢击；来源说明男气越低，威力越强。
  死んだふり: 使自身不被直接选为攻击目标，期间不能攻击；仍可能受范围或全体攻击波及。
  パンチラキック6: 以女性气质发动白兵踢击；来源说明男气越低，威力越强。
  パンチラキック3: 以女性气质发动白兵踢击；来源说明男气越低，威力越强。
  じゃれる: 干扰一名敌人，使其在本回合无法行动。
  戦場のAED: 尝试复活死亡同伴；来源成功率为50%，成功后HP全满。
  全門発射: 在一回合中发射车上所有可用的车载武器。
  ねらいうち: 使用车载兵器瞄准攻击，提高会心一击的发生机会。
  暗黒舞踏: 以腕力对同一目标发动3至4次通常属性攻击，目标不会在敌人间分散。
  掘る: 犬可能执行的挖掘动作；既有来源记载偶尔可找到物品。
  気つけ薬: 解除全体同伴的睡眠、兴奋、混乱和麻痹，不能解除魅惑或束缚。
  ハンターズアイ: 自动识别怪物的属性等战斗信息。
  火炎カブキ: 向小扇形范围喷火，可攻击飞行敌人；范围与DQFF的敌全体记载不同。
  男気キック: 以男气值发动白兵攻击；男气越高，威力越强。
  ヨコヅナオーラ: 短时间大幅提高身体能力；来源记为3回合、3倍，并指出攻击力提升不等于伤害倍率提升。
  パンチラキック2: 以女性气质发动白兵踢击；来源说明男气越低，威力越强。
  男気パンチ2: 以男气值发动白兵攻击；男气越高，威力越强。
  ニトロラリアット: 发动高威力套索臂，具有较高会心概率；来源的会心概率随等级变化。
  ドラムストレッチ: 提高下一回合攻击力；来源记为2倍，且不适用于男气拳、飞裙踢、火焰歌舞伎或喷射肩撞。
  みだれなげ: 一次连续使用多个对应的投掷类战斗道具，消耗相应数量的物品。
  男気キック2: 以男气值发动白兵攻击；男气越高，威力越强。
  大破修理: 使用修理工具，将大破的车辆部件恢复为正常状态。
  砲弾ゲージツ: 组合材料制作特殊炮弹或炮弹材料，成功率与等级相关。
  突進: 犬以体当攻击一名敌人，来源明确指出防御力越高威力越大。
  獲物の匂い: 调查当前位置会出现的怪物。
  人間パトリオット: 用已装备且支持迎击的人类武器自动拦截敌方弹丸；并非所有武器都能迎击。
  吼える: 威吓生物类敌人，使弱敌逃跑或打断行动；逃跑目标不提供经验值。
  ジェットハット: 以防御力相关的体当攻击敌人；对方防御过高时可能反伤自身。
  禁断の注射器: 尝试使生物或昆虫类目标立即死亡；不能视为对所有非机械敌人均有效。
  ゆるめる: 降低机械或战车类敌人的防御力，可重复施加。
  最も危険な修理: 战斗中暂时下车，使用修理工具维修车辆部件。
  男気パンチ4: 以男气值发动白兵攻击；男气越高，威力越强。
  改造ゲージツ: 消耗超稀有金属，进行车载装备的超改造；武器、C装置和引擎的变化不同。
  ニンジャステップ: 本回合提高闪避；来源指出可上下车的战斗中效果可能错误施加给车辆。
  ぶっぱなす: 一回合内用已装备且可用的人类武器依次攻击；原DQFF说明有截断，保留来源差异。
  砲撃演舞: 以所选车载兵器连续攻击；来源将相关职业等级与攻击次数联系，并限定主艺术家可达4次。
  男気パンチ: 以男气值发动白兵攻击；男气越高，威力越强。
  スパナ乱舞: 以腕力发动全体攻击，对机械和战车类敌人尤其有效。
  電光石火: 以所选车载兵器连续攻击；攻击次数会随相关职业等级变化。
  戦いのフェロモン: 在移动时提高遇敌率；可用驱敌喷雾消除该效果。
  薬の知識: 自动增强恢复药品的效果；副职业习得后改成其他职业仍然有效。
  ゴーストドリフト: 在回合开始时专注驾驶，回避多数攻击并清除若干车辆异常；部分攻击仍会命中。
  金粉ゲージツ: 暂时提高属性攻击抵抗；来源对攻略本增幅说法提出异议，0.99具体增幅待核。
  解体: 尝试使机械或战车类目标立即死亡，成功率受等级与难度影响，并非对所有此类敌人有效。
  ダブルアタック: 用同一件人类武器连续攻击两次。
  ハンターマジック: 习得后可在战车中使用人类武器和道具，发动时短暂离车；不消耗技能次数。
  着ぐるみゲージツ: 换装模仿特定怪物，以不同模式发动攻击。
