mechanics:
  電光石火:
    - code: hunter-four-attacks
      source_page: ハンター
      section_ja: 概要
      summary_zh: 来源写明相关主副等级之和达到120时可固定攻击4次，并限定仅主猎人可达4次；不将此式套用到任意两职业等级。
      evidence_ja:
        - メインLv＋サブLv ≧ 120
        - 確定で4回攻撃
        - メインハンターのみ4回攻撃
      raw_values:
        level_condition_raw: メインLv＋サブLv ≧ 120
        attack_count_raw: '4'
  砲撃演舞:
    - code: artist-four-attacks
      source_page: アーチスト
      section_ja: 概要
      summary_zh: 来源写明相关主副等级之和达到120时可攻击4次，并限定仅主艺术家可达4次；不将此式套用到任意两职业等级。
      evidence_ja:
        - メインLv＋サブLv ≧ 120
        - メインがアーチストの場合のみ
        - 4回攻撃
      raw_values:
        level_condition_raw: メインLv＋サブLv ≧ 120
        attack_count_raw: '4'
  囮よせ:
    - code: lure-constraints
      source_page: ハンター
      section_ja: 概要
      summary_zh: 海上不能诱敌，也不能直接呼叫只作为战斗增援出现的敌人；来源指出敌人抢先行动机会较高。
      evidence_ja:
        - 海の上だけは勘弁
        - 乱入専用の敵キャラを直接呼び寄せることはできない
        - 敵の先制率が通常のエンカウントよりかなり高い
  ハンターマジック:
    - code: hunter-magic-auto
      source_page: ハンター
      section_ja: 概要
      summary_zh: 该技能习得后自动生效，无技能次数消耗；可从车内使用人类武器和道具，但不能因此使用所有白兵技能。
      evidence_ja:
        - 回数消費性ではなくなり、習得していればオート発動
        - 人間武器攻撃やアイテム使用が可能
        - 搭乗中の特技はクルマのもの
  ゴーストドリフト:
    - code: ghost-priority-and-exceptions
      source_page: ハンター
      section_ja: 概要
      summary_zh: 在回合开始时发动，并清除燃烧、冷却、酸、烟幕、水泥等状态；怪音波、部分尾击等攻击可绕过回避。
      evidence_ja:
        - 必ずターンの最初に発動
