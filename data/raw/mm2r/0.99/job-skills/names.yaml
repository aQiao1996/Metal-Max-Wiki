    evidence_ja:
      - 職業は全部で6種類
      - 職業によって、成長の仕方が変わり
      - サブジョブも、本来の職業と同様に
    raw_values:
      human_job_count_raw: '6'
  - code: unlock-sub-job
    source_page: unlock
    section_ja: 覚醒！潜在能力！
    summary_zh: 在渴望酒吧2楼向楼梯附近的老人取得潜在能力耳机，使用后解锁副职业。
    evidence_ja:
      - 階段のすぐそばにいる老人
      - 潜在能力ヘッドホン
      - サブジョブが解禁
  - code: sub-job-equipment
    source_page: faq
    section_ja: SFC版との違いは?
    summary_zh: 可装备物品依主职业决定；副职业提供其技能，不授予副职业装备权限。
    evidence_ja:
      - 装備品はメインジョブ由来の品のみ
      - サブジョブはその特技のみの使用
  - code: sub-job-change
    source_page: faq
    section_ja: SFC版との違いは?
    summary_zh: 移动中可自由切换副职业。
    evidence_ja:
      - サブジョブは移動中ならどこでも自由に変更可能
  - code: field-skills-retained
    source_page: faq
    section_ja: サブジョブはどれを選べばいい？
    summary_zh: 移动中可使用已经学会的非当前副职业技能，例如诱敌、炮弹艺术及维修。
    evidence_ja:
      - 移動中は選択されていないサブジョブの特技も使用可能
      - 囮よせ
      - 砲弾ゲージツ
  - code: same-main-sub-use-counts
    source_page: ハンター
    section_ja: サブ選択
    summary_zh: 主副职业选择相同职业时，有次数限制的技能会增加可用次数；来源未给统一逐级公式。
    evidence_ja:
      - サブ職とメイン職で同じものをとった場合
      - 回数制限系のスキルはちゃんと増えてくれる
  - code: sub-job-level-cap
    source_page: growth
    section_ja: 所感
    summary_zh: 来源将副职业等级上限记为Lv99；高等级主职业与副职业的可用次数不能混为同一口径。
    evidence_ja:
      - サブクラスはLv99で打ち止め
    raw_values:
      sub_job_level_cap_raw: Lv99
