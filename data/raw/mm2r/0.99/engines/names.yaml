acquisition:
  さびたエンジン: 贝内特海之家周边及熔岩镇附近随机埋藏，需要金属探测器。
  ショベルヘッド: 野狗号初始装备；码头镇北部沙漠随机埋藏。
  ムラマサ: 白摩托初始装备；也可由MM3转送。
  ムラマサターボ: 租赁2号初始装备另有记录。
  ビートル: 越野车初始装备；租赁1号、10号初始装备另有记录。
  ビートルターボ: 玛多东南商人营地出售。
  ジャンゴ: 厄尔尼诺出售；码头镇北部沙漠可再生埋藏物，星级可变。
  チヨノフ: 码头镇出售；租赁4号初始装备另有记录；狗之村南侧沙滩随机埋藏，星级可变。
  チヨノフターボ: 梓镇及其北部商人营地出售；装甲车初始装备；佛像村周边随机埋藏，星级可变。
  ディーゼル3000: 野巴士初始装备；码头镇沙漠西北侧埋藏，星级可变。
  ブル: 梓镇及其北部商人营地出售；战神初始装备；布拉德博物馆B1左上木箱、掠夺者之塔5层木箱；干渴酒吧西北随机埋藏，星级可变。
  ギガブル: 干渴酒吧出售；贝内特海之家西侧山间随机埋藏，星级可变。
  クーリー: 巴扎斯卡出售；佛像村周边草地随机埋藏，需要金属探测器。
  強力クーリー: 霍克交易所及德尔塔运货前出售；猛犸初始装备。
  超絶クーリー: 爱之碎片东南偏南方向打捞可得无星品。
  タイガータービン: 巴扎斯卡出售，限货物模式A；租赁9号初始装备另有记录。
  トルネード: 干渴酒吧东南沙漠的东北一带埋藏，需要金属探测器，星级可变。
  インパルス: 德尔塔出售；大社镇一带随机埋藏，星级可变。
  インパルスターボ: 佛像村东侧商人营地出售。
  インパルスターボIII: 大社镇出售；赫尔梅茨岛B4F南侧房间木箱，星级可变。
  スーパーインパルス: 以斯拉港西侧及风力发电站西南商人营地出售；大象初始装备；掠夺者之塔下方一带打捞。
  カープエンジン1: 德尔塔出售，限货物模式B。
  V6ペガサス: 以斯拉港、风力发电站西南商人营地出售；多辆租赁车初始装备另有记录。
  白虎アクセル: 以斯拉港出售，限货物模式C。
  ティンカーブル: 大社镇出售；赫尔梅茨岛B2F的9号房间及B3F南侧房间木箱；死亡十字西侧沙漠随机埋藏；首次制作巴特战车可获无星品。
  アシストターボ: 打捞可得无星品；赫尔梅茨岛B4F、风力发电站1F可得星级可变的装备。
  V24ハルク: 风力发电站西南商人营地出售；赫尔梅茨岛B3F南侧房间木箱，星级可变。
  V32ハルク: 摩洛波克出售。
  ルドルフ: 摩洛波克出售；死亡十字南侧埋藏，星级可变。
  ルドルフターボ: 履带村及其北部商人营地出售。
  ルドルフツインT: 死亡十字西侧沙漠商人营地出售。
  サイクロン: 解放后的死亡十字出售，限货物模式A。
  トライアル: 解放后的死亡十字出售，限货物模式B。
  スパイラル: 解放后的死亡十字出售，限货物模式C。
  シルフィードα: 阻止暴走野巴士任务的奖励候选；由熔岩镇前往拜亚斯城、离开雨谷后的左侧尽头埋藏，星级可变；也可由MM3转送。
  ヌードカルメン: 熔岩镇出售；拜亚斯城东南埋藏，需要金属探测器。
  ターボカルメン: 零号战车初始装备为无星。
  サウルスエンジン: 熔岩镇出售，限货物模式A。
  フレンド: 巴特战车初始装备，固定一星。
  グッドフレンド: MM3超时空转送可得无星品。
  ゴッドフレンド: 巴特的礼物任务奖励，固定三星。
  ツバエリターボ: 印章店50点奖励为固定一星；MM3超时空转送可得无星品。
  玄武タービン: 死亡十字西侧沙漠埋藏，星级可变；大型垃圾拾荒者C型（デカごみあさり(C)）掉落。
  ビーナスジェット: 雨谷内西侧出口方向埋藏，需要金属探测器。
  V48コング: 拜亚斯城B6F。
  T-レックス改: 重机雷克斯（重機レックス）掉落一星；MM3的T-雷克斯转送后变化为此型号。
  ウオノクラフトα: 飞鱼乌翁（トビウオン）掉落。
  ダイダロッド: 戴达罗斯（ダイダロス）掉落。
  無双ドライブ: 印章店8000点奖励，固定三星。
  バイオエンジン: 贝希摩斯（ベヒムース）掉落；MM3超时空转送可得无星品。
  光子力ジェット: 击破15000个以上敌人的奖励，固定三星。
  フェノミナン: MM3超时空转送可得0、1星；2星仅见租赁19号初始装备记录。
  メテオドライブ: MM3超时空转送可得2星；3星仅见租赁19号初始装备记录。
rental_only_stars:
  フェノミナン: [2]
  メテオドライブ: [3]
notes:
  ゴッドフレンド: 固定三星，为独立奖励型号；不能从最终朋友继续强化获得。一周通常只能取得一个，双引擎同名搭配需要额外来源。
  ラストフレンド: 朋友系列的强化终点，不能继续强化成神之朋友。
  アシストターボ: 必须装在双引擎的二号槽；加成取决于一号引擎载重。提高辅助涡轮自身星级会增加其本体载重，不会把70%的比例继续提高。
  ブリテリターボG: 出世鱼系列终点，特性由普通型变为双引擎同名加成；只强化一台到此型号不会与不同型号自动配对。
  オメガバイオ: 生物系列终点，新增双引擎同名加成；需两台同名型号才能生效。
  光子力ジェット: 固定三星，只能装在引擎一号槽；击破数奖励通常仅提供一个，交易通信另计。
  無双ドライブ: 固定三星，只能装在引擎一号槽；“无双型”是槽位限制，不是额外载重倍率。
  フェノミナン: 0、1星来自MM3转送；2星记录来自租赁19号初始装备，不能据此认定能作为自有装备取得。
  キングサウルス: 裸载重较高，但自重很大，不能只按载重排序判断可用装甲空间。
traits:
  ノーマルタイプ:
    name: 普通型
    activation: 无特性
    effect: 不提供额外载重加成。
    limits: 表格显示当前型号、当前星级的单台基础载重，仍需扣除整车和装备重量。
  カーボーナス:
    name: 汽车加成
    activation: 被动生效
    effect: 在符合条件的轮式车辆上，来源记录载重增加80%。
    limits: 摩托车不适用；不要与覆盖范围更大的轮胎加成混淆。
  戦車ボーナス:
    name: 战车加成
    activation: 被动生效
    effect: 在履带战车型车辆上，来源记录载重增加80%。
    limits: 依赖车型，不能给全部车辆通用增加载重。
  タイヤボーナス:
    name: 轮胎加成
    activation: 被动生效
    effect: 在战车型以外的车辆上，来源记录载重增加80%。
    limits: 来源独立详情明确列有摩托、巴士、越野车、跑车和装甲车；与排除摩托的汽车加成不同。
  バイクボーナス:
    name: 摩托加成
    activation: 被动生效
    effect: 装在摩托车上时，来源记录载重增加80%。
    limits: 依赖摩托车型，普通轮式车和履带战车不适用。
  シングルボーナス:
    name: 单引擎加成
    activation: 被动生效
    effect: 装在单引擎车辆上时，来源记录载重增加80%。
    limits: 需要车辆为单引擎配置，不是双引擎车辆只装一台即可获得加成。
  無双タイプ:
    name: 无双型
    activation: 无特性
    effect: 只能装备在引擎一号槽，不额外增加载重。
    limits: 不能装备在二号槽，可作为一号引擎与辅助涡轮搭配。
  アシストボーナス:
    name: 辅助加成
    activation: 被动生效
    effect: 辅助涡轮装在二号槽时，额外增加一号引擎基础载重的70%。
    limits: 合计为一号载重加二号载重，再加一号载重乘0.70；不是两台总载重乘1.70。还需扣除引擎及其他装备自重。
    calculation_source: https://metalmaniax.com/cgi-bin/dictionary/ziten.cgi?action=view&data=2443
  ツインボーナス:
    name: 双引擎同名加成
    activation: 被动生效
    effect: 两台装置为同名型号时，额外增加一号引擎基础载重的35%，同类加成不重复叠加。
    limits: 同系列不同强化型号无效，允许星级不同。合计为一号载重乘1.35再加二号载重，不是两台总载重乘1.35。
    calculation_source: https://metalmaniax.com/cgi-bin/dictionary/ziten.cgi?action=view&data=2444
# 加成计算说明于2026-11-02通过来源检索缓存核对；原词典页面直连当前返回404。
capacity_note: 载重为当前型号、当前星级的单台基础值，不含特性加成，未扣除引擎和其他装备重量。防御与重量改造不代表马力强化；马力强化会变为下一级型号，请沿强化路径比较。
