appearance:
  スナザメ:
    - section_ja: 出現場所
      summary_ja: マドとエルニニョの間の砂漠を移動するシンボルと接触して遭遇する。
      summary_zh: 在玛多与厄尔尼诺之间的沙漠接触移动中的背鳍标志遭遇。
      evidence: [二つの町の間の砂漠, MAP上に背びれ]
  デスペロイド:
    - section_ja: 出現場所
      summary_ja: エルニニョ北東、電柱に囲まれた砂漠や町の北東の十字路付近に出現する。
      summary_zh: 在厄尔尼诺东北、电线杆围绕的沙漠及出镇后东北十字路附近随机遭遇。
      evidence: [エルニニョ北東の砂漠, 電柱, 十字路付近でもエンカウント]
  アダムアント:
    - section_ja: 出現場所
      summary_ja: 森林監視局の右奥から入る巨大アリの洞くつのB4F奥にいる。
      summary_zh: 位于森林监视局右后方入口通往的巨大蚁穴B4F深处。
      evidence: [森林監視局, 外観右奥, 巨大アリの洞くつ, B4F奥]
  千手沙華:
    - section_ja: 出現地帯
      summary_ja: ハトバ西、森林監視局南西の森林にいる。シンボルに話しかけて戦闘を選択する。
      summary_zh: 位于码头镇以西、森林监视局西南的树林；与地图标志交谈后选择战斗。
      evidence:
        [ハトバ西の森林地帯, 森林監視局の南西, シンボルに話しかける, 選択肢]
  サイゴン:
    - section_ja: 出現場所
      summary_ja: アズサとサースティの間でランダム遭遇する。草原では出現しない模様と記載されている。
      summary_zh: 在梓镇与干渴酒吧之间随机遭遇；来源注明草地区域似乎不出现。
      evidence:
        [アズサ～サースティの間でランダムエンカウント, 草原には出現しない模様]
  スカンクス:
    - section_ja: 出現地帯
      summary_ja: サースティ北にあるグラップルタワーの最上階にいる。
      summary_zh: 位于干渴酒吧北面的掠夺者之塔最上层。
      evidence: [サースティーの酒場北, グラップルタワー最上階]
  天道機甲神話:
    - section_ja: 出現場所
      summary_ja: ノボトケの村周辺の草原にランダム出現し、村を出た地点でも囮よせできる。
      summary_zh: 在佛像村周边草地随机遭遇，出村原地也可使用诱敌。
      evidence:
        [ノボトケの村, 周辺の草原でランダムエンカウント, その場で囮よせ可能]
  トビウオン:
    - section_ja: 出現地帯
      summary_ja: デルタ・リオとイスラポルトの連絡航路付近の湖にいる。ハンターオフィスの情報で位置が表示される。
      summary_zh: 在德尔塔利奥至以斯拉港航线附近的湖面活动；听取猎人事务所情报可显示地图标志。
      evidence: [デルタ・リオ、イスラポルト連絡航路付近, 地図上にアイコン]
  U-シャーク:
    - section_ja: 出現地帯
      summary_ja: ビイハブ船長の小屋付近の海にいる。ハンターオフィスの情報で位置が表示される。
      summary_zh: 在比哈布船长小屋附近海面活动；听取猎人事务所情报可显示地图标志。
      evidence: [ビイハブ船長の小屋付近, 地図上にアイコン]
  マダム・マッスル:
    - section_ja: 出現場所
      summary_ja: 悪党ミュージアム南、車両が入れない地域のプロテイン・パレス地下にいる。
      summary_zh: 位于以斯拉港以东、恶党博物馆南面的蛋白质宫殿地下；该区域车辆无法进入。
      evidence:
        [
          イスラポルト東,
          悪党ミュージアム南,
          車両侵入不可地帯,
          プロテイン・パレス地下,
        ]
  外道販売鬼:
    - section_ja: 出現地帯
      summary_ja: バトー研究所南東、破壊できる廃ビルの東にある自販機パラダイスにいる。
      summary_zh: 位于巴特研究所东南、可破坏废楼以东的自动贩卖机天堂。
      evidence: [自販機パラダイス, バトー研究所の南東, 廃ビルのすぐ東]
    - section_ja: 要点攻略
      summary_ja: 画面外になると移動する自販機を探し、商品を購入して当たりを出すと戦闘になる。
      summary_zh: 寻找移出画面后会换位的贩卖机；购买任意商品并中奖后触发战斗，并非随机遇敌。
      evidence:
        [
          ランダムエンカウントではない,
          現れたり消えたりする自販機,
          品物は何でも良い,
          当たり,
          戦闘に突入,
        ]
  カミカゼキング:
    - section_ja: 出現地帯
      summary_ja: イスラポルト北北東の魔女の住処周辺に出現する。
      summary_zh: 出现在以斯拉港东北偏北、魔女住处周边。
      evidence: [イスラポルト北北東, 魔女の住処周辺]
    - section_ja: 要点攻略
      summary_ja: 周辺のスクラヴードゥーやカミカゼボムとの戦闘へ乱入する。
      summary_zh: 可通过在当地与骷髅巫毒或神风炸弹战斗，等待其乱入遭遇。
      evidence: [スクラヴードゥー1体のエンカウント, 乱入, カミカゼボムを囮よせ]
  カリョストロ:
    - section_ja: 出現地帯
      summary_ja: ダーク・カナル地下2階の、砂利で覆われた小部屋にいる。
      summary_zh: 位于黑暗水道地下2层、覆盖砂砾的小房间，即有汪汪炮活动的楼层。
      evidence: [ダーク・カナル地下2階, 砂利で覆われている小部屋, バウワウ砲]
  ダスト原人:
    - section_ja: 出現地帯
      summary_ja: 個別攻略ページでは風力発電所B1に出現すると記載されている。
      summary_zh: 独立详情注明位于风力发电站B1；赏金首总表写B2F，楼层存在来源冲突。
      evidence: [風力発電所B1]
  トータルタートル:
    - section_ja: 出現場所
      summary_ja: イスラポルト西の海を泳いでいる。Uシャークとの戦闘に乱入する場合もある。
      summary_zh: 在以斯拉港西面海域活动，也可能乱入U鲨鱼战斗；猎人事务所情报可显示地图标志。
      evidence: [イスラポルト西の海, Uシャーク討伐時にも乱入, 地図上にアイコン]
  ヒトデロン:
    - section_ja: 出現場所
      summary_ja: モロ・ポコ北の入江に出現する。エリーザ同行時は烏帽子岩の左上付近で遭遇イベントが起こる。
      summary_zh: 出现在摩洛波克北部海湾；同行任务“艾莉莎的恋人”中，在海湾中央乌帽子岩左上附近可触发遭遇事件。
      evidence: [モロ・ポコ, 北の入江, エリーザの恋人, 烏帽子岩の左上辺り]
    - section_ja: クエストは関係ない？
      summary_ja: 「エリーザの恋人」は通常遭遇の必須条件ではない。イベント戦では逃走し、別にランダム遭遇で戦える。
      summary_zh: “艾莉莎的恋人”并非普通遭遇的必要条件；任务事件战会逃走，通常讨伐通过该海湾的随机遭遇进行。
      evidence:
        [
          ここでは撃破できず逃げられて終了,
          ランダムエンカウント,
          発生は必須ではなく,
        ]
  グロウイン:
    - section_ja: 出現地帯
      summary_ja: 奇怪ヶ島の地下から進んだグロウイン体内の最深部にいる。
      summary_zh: 位于奇怪岛地下通往的古洛温体内最深处。
      evidence: [奇怪ヶ島, 地下, グロウインの体内最深部]
  ブルフロッグ:
    - section_ja: 出現場所
      summary_ja: バザースカ東の島にあるデビルアイランドにいる。
      summary_zh: 位于巴扎斯卡东侧岛屿上的恶魔岛设施内。
      evidence: [デビルアイランド, バザースカ東の島]
  金輪際ゴースト:
    - section_ja: 出現地帯
      summary_ja: ヘルメツ島南、あいのかけら西の半島にある金輪際ホテルにいる。
      summary_zh: 位于赫尔梅茨岛以南、爱之碎片以西半岛上的金轮际旅馆。
      evidence: [ヘルメツ島, あいのかけら, 西の半島, 金輪際ホテル]
    - section_ja: 戦闘準備
      summary_ja: 熱センサーで居場所を特定する。「くさったスープ」は厨房の鍋から入手でき、戦闘中の逃走を防ぐために使う。
      summary_zh: 用热传感器确定位置；厨房锅内可取得腐烂浓汤，战斗中使用可阻止其逃跑。
      evidence: [厨房の鍋, くさったスープ, 熱センサーで居場所を特定, 逃走を防ぐ]
  きゃたつラー:
    - section_ja: 出現地帯
      summary_ja: モロ・ポコ入口正面の階段に触れると徒歩戦闘になる。2F側から触れても戦える。
      summary_zh: 接触摩洛波克入口正前方的楼梯即触发白兵战；从2层接触楼梯也可触发。
      evidence: [入口からすぐにある正面の階段, 白兵戦, 2Fから階段に触れても戦闘]
  ピチピチブラザーズ:
    - section_ja: 出現地帯
      summary_ja: 「極悪非道？の兄弟」の各地でのイベントを進め、メルトタウン地下道で最終戦を行う。道中の全遭遇が必須ではない。
      summary_zh: 推进“穷凶极恶？的兄弟”系列事件后，在熔岩镇地下道进行最终战；来源注明途中部分会面可跳过。
      evidence:
        [
          極悪非道？の兄弟,
          メルトタウン地下道,
          最後の戦闘,
          遭遇しなくてもクリアは可能,
        ]
  ダイダロス:
    - section_ja: 出現場所
      summary_ja: キャタピラビレッジ東の砂漠でランダム出現する。囮よせ時は乱入する空間を残す必要がある。
      summary_zh: 在履带村东侧沙漠随机遭遇；使用诱敌时需给其乱入留下足够战场空间。
      evidence: [キャタピラビレッジの東, ランダムエンカウント, 乱入出来る隙間]
  サンディダンディ:
    - section_ja: 出現地帯
      summary_ja: モロ・ポコ南、南ゲート東の砂漠にいる。熱センサーがないと姿の確認も遭遇もできない。
      summary_zh: 位于摩洛波克南部、南关卡以东的沙漠；需要热传感器才能发现并遭遇。
      evidence:
        [
          モロ・ポコ南の砂漠,
          南ゲートから東,
          熱センサーが無いと目視及びエンカウントが不可能,
        ]
  ぐんかんサウルス:
    - section_ja: 出現場所
      summary_ja: レインバレーのランダム遭遇と、クエスト「霧の中で」で遭う経路がある。
      summary_zh: 可在雨谷随机遭遇，也可在“浓雾之中”任务期间遇到。
      evidence: [レインバレーでランダムエンカウント, クエスト「霧の中で」の最中]
  ホバリング・ノラ:
    - section_ja: 出現地帯
      summary_ja: メルトタウン周辺でランダム出現または乱入する。「霧の中で」の廃墟では単独で出現する。
      summary_zh: 在熔岩镇周边随机遭遇或乱入；“浓雾之中”任务的废墟战中单独出现。
      evidence:
        [
          メルトタウン周辺でランダムエンカウント,
          乱入でも出現,
          クエスト「霧の中で」,
          単独で出現,
        ]
  テッド・ブロイラー:
    - section_ja: 御鎮座場所
      summary_ja: バイアス・シティB3F、西側のフェイル・セイフ・ロックの手前にいる。
      summary_zh: 位于拜亚斯都市B3F，西侧故障安全锁之前。
      evidence: [バイアス・シティ, B3F, 西側フェイル・セイフ・ロック手前]
  U-U-シャーク:
    - section_ja: 出現地帯
      summary_ja: 湖上では逃走するため倒せない。本編クリア後は、湖で遭わなくても干潮時のウォーターバイパスで戦える。
      summary_zh: 湖面遭遇时会强制逃走，无法在那里击破；通关后退潮时可直接在码头镇东南的水上大楼“水道旁路”内遭遇，无需先完成湖面遭遇。
      evidence:
        [
          ウォーターバイパス,
          ハトバ南東の海上にあるビル,
          絶対に撃破は不可能,
          本編クリア後なら干潮時のビル,
          湖上で遭遇する必要はない,
