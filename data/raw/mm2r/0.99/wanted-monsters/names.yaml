schema_version: 1
reference_note: 中文名称与地点为日版公开资料的参考译名和编辑摘要，未核验0.99实机名称、数值或事件；日文原名与逐页出处单独保留。
probability_note: 概率只保留カエル研究室原表的各槽百分比文本，不推断槽位统计独立性、合计掉落率、难度或闪光加成及星级概率；该站未说明表值的抽样或解析方法。
