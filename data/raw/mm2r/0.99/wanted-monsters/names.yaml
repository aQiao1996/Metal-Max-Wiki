source_alias_notes:
  デスぺロイド: 概率表的「ぺ」为平假名，日文名单使用片假名「ペ」；保留原始名称并显式对应。
  デスぺローダー: 概率表的「ぺ」为平假名；装备详情链接与日文名单使用片假名「ペ」。
  天道機甲神話（本体）: 概率表区分本体；悬赏总表名称不带括号。
  Ｕ－シャーク: 概率表使用全角拉丁字母和横线；对应日文悬赏总表U-シャーク。
  Ｕ‐Ｕ‐シャーク: 概率表使用全角字母与不同横线；对应日文悬赏总表U-U-シャーク。
  プロイラーボンベ: 悬赏总表显示为「プロ」，但其装备详情链接和概率表均为「ブロ」；原文与纠正名称同时保留。
  ラグナ゠ロック: 赏金首详情标题使用片假名双连字符；悬赏总表及概率表使用全角等号。
