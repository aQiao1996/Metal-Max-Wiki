schema_version: 1
reference_note: 中文任务名、地点与步骤是日版公开资料的参考译名及编辑事实摘要；zzjb原表的RPC0.9译名另保留，全部未经0.99实机确认。
coverage_note: METAL MAniaX总表编号1至101完整采集；zzjb当前页面只有8条，并非旧解析器遗漏其他表。原表或详情接取条件明确写出「特別な依頼」时标为special_request，其他项归普通或事件任务，不据此排除其他接取渠道。
quests:
  1:
    name_ja: マリアよ、安らかに眠れ
    name_zh_reference: 玛丽亚，安息吧
    location_zh: 游戏开始
    acceptance_zh: 随主线开始。
    steps_zh:
      - 推进主线并击败最终首领。
  2:
    name_ja: 砂漠を越えて
    name_zh_reference: 穿越沙漠
    location_zh: 玛多、厄尔尼诺
    acceptance_zh: 在纳伊鲁车库1层询问机械师，或在厄尔尼诺取得纳伊鲁的消息。
    steps_zh:
      - 前往厄尔尼诺找到纳伊鲁，返回玛多接收并命名越野车；休息一晚后再次与他交谈。
    vehicle_related: true
    detail_checks:
      - section_ja: 達成条件
        terms:
          - バギーを調べ
          - 名前をつける
          - 一晩経過
      - section_ja: コメント
        terms:
          - No.1戦車
          - レンタルタンク屋が開店
    reward_notes_zh:
      - 任务进行中取得1号战车；完成后玛多租赁战车店开业。
  3:
    name_ja: 埋もれたマンホール
    name_zh_reference: 被掩埋的井盖
    location_zh: 玛多东北废墟
    acceptance_zh: 调查被瓦砾掩埋的井盖。
    steps_zh:
      - 请人清除瓦砾，开放通往地下的入口。
  4:
    name_ja: 木材ハンター
    name_zh_reference: 木材猎人
    location_zh: 玛多、码头镇、德尔塔利奥、森林监视局
    acceptance_zh: 完成“被掩埋的井盖”后出镇再返回，与木匠迪亚克交谈。
    steps_zh:
      - 在码头镇询问莫里尼下落，在德尔塔利奥联络船码头右侧出口找到他，带回玛多交给迪亚克。
      - 休息一晚后护送采木队到森林监视局，通过战斗推进采木；亚当蚁尚未击败时可另触发救援莫里尼。
      - 返回玛多后至少休息3晚，选择建筑及外观；再休息至少8晚等待建成。
    detail_checks:
      - section_ja: 達成条件
        terms:
          - 3泊以上
          - 8泊以上
          - モリニウ
  5:
    name_ja: モリニウを助けろ！
    name_zh_reference: 帮助莫里尼！
    location_zh: 森林监视局、巨大蚁穴
    acceptance_zh: “木材猎人”进行中且尚未击败亚当蚁；采木开始后登上监视塔。
    steps_zh:
      - 从巨大蚁穴B1F向南下坡、B2F向北下坡，在B3F首处分岔向南找到莫里尼，将他带回地面。
    aliases:
      - 帮助莫里尼
      - 救出莫里尼
      - 帮助莫里尼乌
    failure_notes_zh:
      - 必须在击败亚当蚁之前触发；先击败亚当蚁将错过本任务。
    detail_checks:
      - section_ja: 発生条件
        terms:
          - アダムアント撃破前限定
          - 撃破後は発生しない
      - section_ja: 達成条件
        terms:
          - B1F
          - 南へ
          - B2F
          - 北へ
          - B3F
          - 地上に戻る
  6:
    name_ja: デヤークのおつかい
    name_zh_reference: 迪亚克的差事
    location_zh: 玛多
    acceptance_zh: 着手建造第二栋建筑时触发。
    steps_zh:
      - 交付30个防腐剂，建筑完工后与迪亚克等人交谈。
  7:
    name_ja: タケノコ狩り
    name_zh_reference: 狩猎竹笋
    location_zh: 玛多
    acceptance_zh: 着手建造第三栋建筑时触发。
    steps_zh:
      - 击败超合金竹笋，处理建造现场的障碍。
  8:
    name_ja: 並ばされし者たち
    name_zh_reference: 代人排队
    location_zh: 玛多药店
    acceptance_zh: 药店打折期间与入口的摔跤手交谈。
    steps_zh:
      - 替男子排队并完成其要求。
  9:
    name_ja: 昔のボトルで出ています
    name_zh_reference: 出售陈年酒
    location_zh: 玛多新酒吧
    acceptance_zh: 建好新酒吧后与柜台女老板交谈。
    steps_zh:
      - 卖出10瓶名称以“昔の”开头的酒。
  10:
    name_ja: カジノの救世主
    name_zh_reference: 赌场的救世主
    location_zh: 玛多赌场
    acceptance_zh: 与赌场柜台老板交谈。
    steps_zh:
      - 收集L1、O1、V1、E1芯片及电子零件，修好游戏机。
  11:
    name_ja: イリットと料理の本
    name_zh_reference: 伊莉特与料理书
    location_zh: 玛多
    acceptance_zh: 给伊莉特料理书，休息两晚后再次交谈。
    steps_zh:
      - 把咖喱粉交给伊莉特。
  12:
    name_ja: 世界の果てへ
    name_zh_reference: 前往世界尽头
    location_zh: 玛多新酒吧、人类村
    acceptance_zh: 建好新酒吧并完成“招募高手猎人”后，接受特别委托。
    steps_zh:
      - 把包裹送到人类村的加藤手中。
  13:
    name_ja: 極悪非道？の兄弟
    name_zh_reference: 穷凶极恶？的兄弟
    location_zh: 厄尔尼诺至熔岩镇的连环事件
    acceptance_zh: 在厄尔尼诺猎人事务所与皮奇兄长交谈。
    steps_zh:
      - 推进皮奇兄弟相关会面及连环委托，最终在熔岩镇地下击败兄弟二人。
    failure_notes_zh:
      - 部分会面有截止时机：击败斯坎克斯会跳过再次在厄尔尼诺及干渴酒吧的会面；完成招募高手或搭便车委托也会分别跳过德尔塔利奥或死亡十字的会面。
      - 这些跳过不妨碍任务完成，但会减少冒险指南条目。
    detail_checks:
      - section_ja: コメント
        terms:
          - イベントは消滅
          - ガイド項目の数は減る
  14:
    name_ja: さらわれた女、カティア
    name_zh_reference: 被掳走的卡佳
    location_zh: 厄尔尼诺旅馆
    acceptance_zh: 与旅馆内躺着的赫克托交谈。
    steps_zh:
      - 上2层隔牢门与卡佳说话，再处理掠夺者并救出她。
  15:
    name_ja: 牢破りのメロディ
    name_zh_reference: 劫狱的梅洛蒂
    location_zh: 厄尔尼诺牢房前
    acceptance_zh: 与牢房前的梅洛蒂交谈。
    steps_zh:
      - 救出被关押的阿克塞尔。
  16:
    name_ja: シュリエットの部品
    name_zh_reference: 修莉叶的零件
    location_zh: 厄尔尼诺
    acceptance_zh: 完成“努卡的地下酒吧”后与修莉叶交谈。
    steps_zh:
      - 卖出至少25个电子零件后，再额外卖出至少1个。
  17:
    name_ja: たおすぜ！グラップラー
    name_zh_reference: 打倒掠夺者！
    location_zh: 厄尔尼诺传送装置前
    acceptance_zh: 看过展望大楼前的事件后与里奇交谈。
    steps_zh:
      - 累计击败5名混混掠夺者等军团敌人，再向里奇报告。
  18:
    name_ja: ヌッカの地下酒場
    name_zh_reference: 努卡的地下酒吧
    location_zh: 厄尔尼诺
    acceptance_zh: 完成“打倒掠夺者！”后继续与里奇交谈。
    steps_zh:
      - 向努卡说出暗号。
  19:
    name_ja: ヒヌケ団の密使
    name_zh_reference: 希努克团的密使
    location_zh: 厄尔尼诺
    acceptance_zh: 完成“努卡的地下酒吧”且到访码头镇后与里奇交谈。
    steps_zh:
      - 把要求的武器交给里奇。
  20:
    name_ja: ヒヌケを愛したスパイ
    name_zh_reference: 热爱希努克的间谍
    location_zh: 厄尔尼诺的希努克团据点
    acceptance_zh: 完成密使委托并击败斯坎克斯后，与据点内的里奇交谈。
    steps_zh:
      - 找到间谍手册并交给里奇。
  21:
    name_ja: わたしの愛しいひとだから
    name_zh_reference: 因为他是我心爱的人
    location_zh: 厄尔尼诺展望大楼4层
    acceptance_zh: 与雅兹敏交谈。
    steps_zh:
      - 找到阿隆索，并把他的情况告诉雅兹敏。
  22:
    name_ja: ねずみの始末
    name_zh_reference: 清理老鼠
    location_zh: 厄尔尼诺
    acceptance_zh: 与门多萨会面。
    steps_zh:
      - 取得金假牙并向门多萨出示。
  23:
    name_ja: 続・ねずみの始末
    name_zh_reference: 续·清理老鼠
    location_zh: 厄尔尼诺
    acceptance_zh: 在“清理老鼠”中向门多萨出示金假牙后触发。
    steps_zh:
      - 在“打倒门多萨！”进行期间让门多萨与金牙见面。
  24:
    name_ja: たおすぜ！メンドーザ
    name_zh_reference: 打倒门多萨！
    location_zh: 厄尔尼诺希努克团据点
    acceptance_zh: 完成间谍委托且获得船后，与里奇交谈。
    steps_zh:
      - 推进据点事件并击败门多萨。
  25:
    name_ja: 黄金の冷蔵庫
    name_zh_reference: 黄金冰箱
    location_zh: 厄尔尼诺
    acceptance_zh: 击败门多萨后与艾玛交谈。
    steps_zh:
      - 调查金冰箱。
  26:
    name_ja: 思い出は砂の中
    name_zh_reference: 回忆埋在沙中
    location_zh: 玛多东南商人营地
    acceptance_zh: 获得1号战车后与艾瑞丝交谈。
    steps_zh:
      - 利用探测器找出戒指并交还委托人。
  27:
    name_ja: 帰らぬあの人を探して
    name_zh_reference: 寻找一去不回的人
    location_zh: 码头镇栈桥、巨大蚁穴
    acceptance_zh: 与栈桥旁的阿莉交谈并答应帮忙。
    steps_zh:
      - 接下阿莉的请求后尽快前往巨大蚁穴，把信交给汉特并取得蓝色护目镜。
      - 把护目镜带给阿莉；若要取得阿莉的戒指，需要在报酬对话中提出要求。
    aliases:
      - 寻找一去不返的人
      - 寻找不归之人
    failure_notes_zh:
      - 接取后因住宿经过太多天，汉特可能变成尸体；完成委托后长期不打倒亚当蚁也可能发生。来源未给出确切天数。
      - 未要求戒指报酬时不会取得戒指。先击败亚当蚁不会使本任务消失。
    detail_checks:
      - section_ja: コメント
        terms:
          - 日数を経過させすぎる
          - 死体
          - 指輪を要求
          - 指輪は手に入らない
          - アダムアントを先に倒しても
      - section_ja: ガイド項目一覧
        terms:
          - アリーの手紙をハントに届ける
    reward_notes_zh:
      - 戒指为对话分支奖励，不能把总表列出戒指理解为必定取得。
  28:
    name_ja: 盗まれたコレクション
    name_zh_reference: 被盗的收藏品
    location_zh: 码头镇联络船码头3层
    acceptance_zh: 与老狼交谈。
    steps_zh:
      - 找回被盗的3件物品，分别交还老狼。
  29:
    name_ja: ボムポポの綿毛につつまれて
    name_zh_reference: 被炸弹蒲公英绒毛包围
    location_zh: 码头镇北方商人营地
    acceptance_zh: 到达码头镇后接受特别委托。
    steps_zh:
      - 把蒲公英绒毛交给荣江，休息一晚后再交谈。
    failure_notes_zh:
      - 完成后店铺会撤下“そまつなマフラー”；若要收集其全部种类，应在完成前购买。
    detail_checks:
      - section_ja: コメント
        terms:
          - そまつなマフラー
          - 商品から消え
          - クエストクリア前に購入
  30:
    name_ja: キャラバンの護衛
    name_zh_reference: 商队护卫
    location_zh: 码头镇至梓镇
    acceptance_zh: 有名度至少171时与莉可交谈。
    steps_zh:
      - 一路护送商队抵达梓镇。
  31:
    name_ja: 最後のチワワ
    name_zh_reference: 最后的吉娃娃
    location_zh: 码头镇联络船码头1层、森林监视局附近
    acceptance_zh: 已有狗类伙伴后，与出现的麦克交谈；普通狗也可满足条件。
    steps_zh:
      - 在森林监视局附近树林击败最后的吉娃娃，带证物交差。
  32:
    name_ja: アリの卵
    name_zh_reference: 蚂蚁卵
    location_zh: 码头镇酒吧、巨大蚁穴
    acceptance_zh: 击败亚当蚁并至少休息一晚，且击败斯坎克斯后与酒吧老板交谈。
    steps_zh:
      - 到蚁穴取得内部仍在活动的新鲜蚁卵，交给老板。
  33:
    name_ja: いざ、宝島へ
    name_zh_reference: 出发，前往宝岛
    location_zh: 码头镇酒吧、赫尔梅茨岛
    acceptance_zh: 获得船后与酒吧的白交谈。
    steps_zh:
      - 取得神秘钥匙并用它打开赫尔梅茨岛的井盖。
  34:
    name_ja: 復讐のバイク
    name_zh_reference: 复仇的摩托车
    location_zh: 无名酒吧1层、码头镇北方沙漠
    acceptance_zh: 获得并命名1号战车后，与无名酒吧的蓝衣猎人交谈；领取钥匙需达到12级。
    steps_zh:
      - 领取摩托车钥匙并取得白摩托，击败码头镇北方沙漠的安塔雷斯后返回报告；不要求用白摩托参战。
    vehicle_related: true
    aliases:
      - 复仇摩托
    detail_checks:
      - section_ja: 発生条件
        terms:
          - レベルが12
          - バイクのキー
      - section_ja: 達成条件
        terms:
          - No.10戦車
          - 白バイの使用は達成条件には含まれない
    reward_notes_zh:
      - 接受委托并拿到钥匙时，白摩托即正式成为自有10号战车；不是击败安塔雷斯后才取得。
  35:
    name_ja: 怪しい荷物
    name_zh_reference: 可疑的包裹
    location_zh: 不爆弹之馆、干渴酒吧北部废墟
    acceptance_zh: 到达梓镇后接受特别委托。
    steps_zh:
      - 把包裹带到干渴酒吧北面的废墟；交货可按原运输委托结束。
      - 也可连续拒绝交货，再选择“ぶっとばす！”并击败恶党战车，取得钥匙救出包裹中的琳卡。
    failure_notes_zh:
      - 选择击败收件人的救人分支，会使“可疑的包裹”任务消失，并转入琳卡相关任务。
      - 红石吊坠与恶党战车图鉴在这一事件的不同分支取得；来源注明本周目不能同时登记这两项。
    reward_notes_zh:
      - 交货前可询问报酬并取得最多300G预付；不是交货后另发报酬。
    detail_checks:
      - section_ja: コメント
        terms:
          - ぶっとばす！
          - このクエストが消滅
          - 1周回ではどちらかしか登録できない
  36:
    name_ja: リンカを探して
    name_zh_reference: 寻找琳卡
    location_zh: 梓镇北方商人营地
    acceptance_zh: 到达梓镇后与琳卡父母交谈。
    steps_zh:
      - 琳卡位于“可疑的包裹”所运送的包裹中；拒绝交货并击败恶党战车，取得钥匙后可救出并送回她。
      - 若已把包裹交货，则在德尔塔利奥酒吧后找到红石吊坠，并向父母出示，按另一结局完成。
    reward_notes_zh:
      - 完成方式影响报酬；救出本人并送回可取得4000G，出示吊坠路线为2000G。
    detail_checks:
      - section_ja: コメント
        terms:
          - 荷物の中
          - 赤い石のペンダント
          - 悪党戦車
  37:
    name_ja: リンカの両親をさがせ
    name_zh_reference: 寻找琳卡的父母
    location_zh: 干渴酒吧北方普通废墟
    acceptance_zh: 未接受“寻找琳卡”就先救出琳卡。
    steps_zh:
      - 未先接受“寻找琳卡”时，在包裹事件中救出琳卡，再把她带到干渴酒吧西南的商人营地。
    detail_checks:
      - section_ja: 達成条件
        terms:
          - サースティ南西のトレーダーキャンプ
  38:
    name_ja: 鉄のサメ
    name_zh_reference: 铁鲨鱼
    location_zh: 干渴酒吧东南商人营地
    acceptance_zh: 到达干渴酒吧后与商人交谈。
    steps_zh:
      - 击败铁鲨鱼并回来报告。
  39:
    name_ja: 過去へのトンネル
    name_zh_reference: 通往过去的隧道
    location_zh: 比特隧道
    acceptance_zh: 与比特交谈。
    steps_zh:
      - 修理隧道掘进机，休息一晚后返回，驾驶战车推动车辆。
    vehicle_related: true
  40:
    name_ja: シグナルを追え
    name_zh_reference: 追踪信号
    location_zh: 巴扎斯卡码头
    acceptance_zh: 与码头的厨子王交谈。
    steps_zh:
      - 追踪信号找到并击败大型蝠鲼，把信号弹交还厨子王。
  41:
    name_ja: 家出少女
    name_zh_reference: 离家少女
    location_zh: 巴扎斯卡码头旁
    acceptance_zh: 与萨莉交谈。
    steps_zh:
      - 把她带到码头镇、德尔塔利奥或以斯拉港中的一座港口城镇。
