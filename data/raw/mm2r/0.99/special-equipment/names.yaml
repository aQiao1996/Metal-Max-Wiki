effects:
  シーハンター: 三次鱼雷攻击，可命中潜水目标并破坏零件；自身攻击不受迎击、防御盾和吸引影响，对空中目标无效。与其他武器齐射时仍可能被其他武器触发的防御动作影响。
  DDTシャワー: 毒气全体攻击；不会被弹丸清理器（弾丸クリーナー）和吸尘曼巴（バキュームマンバ）吸收。
  ノラロケット: 四次导弹攻击，弹仓48；三星品同时提升攻击与防御时可能受到重量上限限制。
  風林火山: 四连射与迎击兼用，普通属性，可受对空能力影响；连射与多次攻击是不同的攻击方式。
  トビクラスター: 四次攻击，弹仓16；攻击次数与弹药消耗不能直接混为一谈。
  反重力鉄球: 无限弹药；攻击不受迎击、防御盾和吸引影响，对墙壁与废墟大楼有额外效果；不受对空能力加成。
  エースファイア: 无限弹药的火焰装备；攻击不受防御盾和吸引影响，可配合增加攻击次数的特性使用。
  閃光必罰: 外观为激光，实际是普通属性；全体攻击，不受迎击影响，不受对空能力加成。
  オーロラフリーザー: 光束命中且未被反射时，有概率附加冷气状态；不能借助迎击能力特性作为迎击武器。
  W-トルネード: 四次攻击与迎击兼用；迎击会消耗自身弹药，长时间战斗需留意剩余弹仓。
  一発逆転神話: 弹仓仅1发，为非卖品；与可在商店购买的一击必杀神话是不同装备。
  一撃必殺神話: 弹仓仅1发，可在商店购买；不能仅凭名称推断为必定一击击杀。
  ATパトリオット: 单车迎击装备，主要保护装载它的战车；不能迎击的攻击仍会命中。
  ビームガーディアン: 全体迎击装备，可保护队伍中的其他战车；自身弹仓有限。
  レーザーゴーゴン: 单车迎击装备，主要保护装载它的战车；可扩充弹仓以延长使用时间。
  拡散ファランクス: 全体迎击装备，可保护其他战车；重量较高，需留意迎击对自身车辆的覆盖。
  鼻デテクター: 无限弹药的单车迎击装备，适合持续保护装载它的战车；不能保证拦截全部多段攻击。
  タキオンレーダー: 界面说明为命中补正，但来源同时记录该补正可能未实际生效；不据此宣称命中率或伤害必定提高。
  カリョスモーク: 对单体施加烟幕状态，不直接造成伤害；可被迎击或吸引，不能直接进行超改造。
  閃光迎撃神話: 无限弹药的全体迎击装备，可保护队伍中的其他战车；需要较多载重。
